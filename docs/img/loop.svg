<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">The loop</title>
<desc id="d">The experiment loop in five steps: the agent edits one knob in config.py, commits, runs the locked eval, keeps or reverts against the best kept score, and logs the run to results.tsv, then repeats.</desc>
<rect x="0" y="0" width="1200" height="400" fill="#EDE7DC"/><rect x="1" y="1" width="1198" height="398" fill="#001B3B"/>
<text x="40" y="62" font-family="Georgia, 'Playfair Display', serif" font-size="34" fill="#F2EDE2">The loop</text>
<text x="40" y="94" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">program.md tells the agent what to do. Nobody edits evaluate.py or run.py.</text>
<rect x="40" y="124" width="188.8" height="196" fill="#EDE7DC"/><rect x="41" y="125" width="186.8" height="194" fill="#001B3B"/>
<text x="60" y="160" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">1</text>
<text x="60" y="198" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#F2EDE2">Edit</text>
<text x="60" y="234" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">The agent changes</text>
<text x="60" y="258" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">one knob in</text>
<text x="60" y="282" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">config.py</text>
<rect x="234.8" y="220" width="19" height="4" fill="#8C5348"/><polygon points="252.8,213 266.8,222 252.8,231" fill="#8C5348"/>
<rect x="272.8" y="124" width="188.8" height="196" fill="#EDE7DC"/><rect x="273.8" y="125" width="186.8" height="194" fill="#001B3B"/>
<text x="292.8" y="160" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">2</text>
<text x="292.8" y="198" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#F2EDE2">Commit</text>
<text x="292.8" y="234" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">git commit</text>
<text x="292.8" y="258" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">before the</text>
<text x="292.8" y="282" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">eval runs</text>
<rect x="467.6" y="220" width="19" height="4" fill="#8C5348"/><polygon points="485.6,213 499.6,222 485.6,231" fill="#8C5348"/>
<rect x="505.6" y="124" width="188.8" height="196" fill="#EDE7DC"/><rect x="506.6" y="125" width="186.8" height="194" fill="#001B3B"/>
<text x="525.6" y="160" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">3</text>
<text x="525.6" y="198" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#F2EDE2">Eval</text>
<text x="525.6" y="234" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">evaluate.py, locked</text>
<text x="525.6" y="258" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">10 prompts, shuffled,</text>
<text x="525.6" y="282" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">5-minute budget</text>
<rect x="700.4" y="220" width="19" height="4" fill="#8C5348"/><polygon points="718.4,213 732.4,222 718.4,231" fill="#8C5348"/>
<rect x="738.4" y="124" width="188.8" height="196" fill="#EDE7DC"/><rect x="739.4" y="125" width="186.8" height="194" fill="#001B3B"/>
<text x="758.4" y="160" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">4</text>
<text x="758.4" y="198" font-family="Georgia, 'Playfair Display', serif" font-size="24" fill="#F2EDE2">Keep or revert</text>
<text x="758.4" y="234" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">Above the best</text>
<text x="758.4" y="258" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">kept score? Keep.</text>
<text x="758.4" y="282" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">If not, revert.</text>
<rect x="933.2" y="220" width="19" height="4" fill="#8C5348"/><polygon points="951.2,213 965.2,222 951.2,231" fill="#8C5348"/>
<rect x="971.2" y="124" width="188.8" height="196" fill="#EDE7DC"/><rect x="972.2" y="125" width="186.8" height="194" fill="#001B3B"/>
<text x="991.2" y="160" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">5</text>
<text x="991.2" y="198" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#F2EDE2">Log</text>
<text x="991.2" y="234" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">One row in</text>
<text x="991.2" y="258" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">results.tsv</text>
<text x="991.2" y="282" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">for every run</text>
<rect x="1063.6" y="320" width="4" height="46" fill="#8C5348"/>
<rect x="132.4" y="362" width="935.2" height="4" fill="#8C5348"/>
<rect x="132.4" y="334" width="4" height="32" fill="#8C5348"/>
<polygon points="125.4,335 134.4,321 143.4,335" fill="#8C5348"/>
<text x="600" y="352" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA" text-anchor="middle">repeat, one knob at a time, until you stop it</text>
</svg>
